services:
  moto:
    build: ./moto
    container_name: cloudtrim-moto
    environment:
      - DEFAULT_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "4566:4566"
    healthcheck:
      # Connection-level readiness: the moto server answers as soon as it
      # can accept TCP on the API port.
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 4566), timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  engine:
    build: ./engine
    container_name: cloudtrim-engine
    depends_on:
      moto:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://moto:4566
      - AWS_REGION=us-west-2
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./engine/data:/app/data
      - ./engine/output:/app/output

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudtrim-web
    depends_on:
      - engine
    environment:
      - ENGINE_API_URL=http://engine:8000
    ports:
      - "3000:3000"

# The demo pipeline (seed -> audit -> remediate -> verify) runs on demand:
#   docker compose exec engine cloudtrim demo
# The dashboard at http://localhost:3000 reads live engine state.
#
# Emulator alternatives: point AWS_ENDPOINT_URL (engine service) at a
# LocalStack Pro endpoint if you prefer — every service the demo touches is
# covered there too. Community-edition LocalStack lacks ELBv2, which the
# wasteful-account seed (2 ALBs) requires.
