[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtrim"
version = "1.0.0"
description = "CloudTrim — productized cloud cost audit engine (boto3 + Terraform + ReportLab)"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "SQLAlchemy>=2.0",
  "reportlab>=4.2",
]

[project.scripts]
cloudtrim = "cloudtrim.cli:main"

[tool.setuptools.packages.find]
include = ["cloudtrim*"]
